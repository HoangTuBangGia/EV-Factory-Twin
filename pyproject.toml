[project]
name = "ev-factory-digital-twin"
version = "0.1.0"
description = "Digital Twin platform for AMR-based battery intralogistics in EV final assembly"
authors = [
    { name = "Super Extraordinary X" },
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.urls]
Repository = "https://github.com/AI20K-Build-Phase-Cohort-3/P-078.git"

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "mypy>=1.15",
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.11",
]

[tool.uv.workspace]
members = [
    "apps/backend",
    "packages/twin-core",
    "services/simulation",
    "evaluation",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "apps/backend/docs/BACKEND_IMPLEMENTATION_GUIDE(1).md",
    "scripts/log_antigravity.py",
    "scripts/log_hook.py",
    "scripts/log_manual.py",
    "scripts/submit_log.py",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

[tool.pytest.ini_options]
testpaths = [
    "apps/backend/tests",
    "packages/twin-core/tests",
    "services/simulation/tests",
    "evaluation/tests",
    "tests/integration",
]
addopts = "-ra"

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
