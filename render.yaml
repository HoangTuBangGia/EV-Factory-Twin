services:
  - type: web
    name: ev-factory-twin-api
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./apps/backend/Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    numInstances: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: MOCK_FACTORY_ENABLED
        value: "false"
      - key: DATABASE_SSL_MODE
        value: require
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: EDGE_TELEMETRY_SHARED_SECRET
        sync: false
