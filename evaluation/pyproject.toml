[project]
name = "ev-twin-evaluation"
version = "0.1.0"
description = "Evaluation and benchmark suite for EV Factory Digital Twin"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "twin-core",
]

[tool.uv.sources]
twin-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ev_evaluation"]