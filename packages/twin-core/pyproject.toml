[project]
name = "twin-core"
version = "0.1.0"
description = "Core domain models and metrics for the EV Factory Digital Twin"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twin_core"]
